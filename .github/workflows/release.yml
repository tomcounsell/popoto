name: Release to PyPI

on:
  push:
    tags:
      - "v*"
      - "popoto-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      # scripts/check_sdist_contents.py (#678) -- the only point in the pipeline
      # where a real sdist exists and a failure still keeps it off PyPI. Must
      # stay between the build and the publish step; tests/test_sdist_contents.py
      # asserts that ordering.
      - name: Check sdist contents
        run: python scripts/check_sdist_contents.py dist/*.tar.gz

      # Install the built wheel into two fresh venvs, bare and with the
      # postgres extra, and import what each promises. No database is needed:
      # REDIS_URL points at a closed port and nothing connects. This is what
      # would have caught 1.10.0's release-audit blocker -- a clean
      # `pip install popoto[postgres]` lacked numpy, so the first
      # EmbeddingField raised ImportError. Must stay between the build and the
      # publish step, like the sdist check above.
      - name: Smoke-test the wheel
        env:
          REDIS_URL: redis://127.0.0.1:1/15
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one wheel in dist/, found: ${wheels[*]}" >&2
            exit 1
          fi
          wheel="${wheels[0]}"
          python -m venv "$RUNNER_TEMP/smoke-core"
          "$RUNNER_TEMP/smoke-core/bin/pip" install --quiet "$wheel"
          "$RUNNER_TEMP/smoke-core/bin/python" -c "import sys, popoto; assert 'psycopg' not in sys.modules; print('core ok', popoto.__version__)"
          python -m venv "$RUNNER_TEMP/smoke-pg"
          "$RUNNER_TEMP/smoke-pg/bin/pip" install --quiet "${wheel}[postgres]"
          "$RUNNER_TEMP/smoke-pg/bin/python" -c "import popoto; from popoto.fields.embedding_field import EmbeddingField; import numpy, psycopg, pgvector, greenlet; from psycopg_pool import ConnectionPool; assert hasattr(ConnectionPool, 'check_connection'); print('postgres ok', popoto.__version__, psycopg.pq.__impl__)"
          "$RUNNER_TEMP/smoke-pg/bin/popoto-migrate-redis-to-postgres" --help > /dev/null
          echo "console script ok"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

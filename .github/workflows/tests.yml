name: Tests

# Restores server-side test coverage on pull requests.
#
# #405 removed stress-tests.yml and test-valkey.yml in favour of the local
# scripts/ci-local.sh runner. That left the repo with no automated Valkey
# coverage at all, and the local runner only ever talks to Redis. The README
# states that Valkey is a first-class target, so a Valkey job has to run
# somewhere that is not a developer laptop.
#
# Two separate jobs rather than a matrix: the Redis and Valkey results appear
# as independently named checks, so a Valkey-only failure is visible at a
# glance instead of being buried in a matrix leg, and each job can health-check
# its own server with that server's own CLI.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a PR cancels the older run for that PR. On main,
# cancel-in-progress is false, so a run that has started always finishes -- but
# a run still queued when the next push arrives is superseded by it, which is
# why some main runs show as cancelled with no jobs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  redis:
    name: pytest (Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # The database number must match `popoto_test_db` in pyproject.toml;
      # tests/test_ci_workflow_redis_url.py fails if the two ever disagree.
      REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      # Extras are load-bearing. With [dev] alone, numpy and
      # sentence-transformers are missing and roughly 95 tests skip or fail to
      # collect without the run looking any different. [dataframe] is
      # deliberately excluded: it pulls pandas, which breaks
      # test_dataframe_field.py collection on current Python 3.x.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,embeddings,benchmark]"

      - name: Verify server reachable
        run: |
          python - <<'PY'
          import redis
          r = redis.from_url("redis://localhost:6379")
          r.ping()
          info = r.info("server")
          print("server_name:", info.get("server_name", "redis"))
          print("version:", info.get("redis_version"))
          PY

      # Guards the silent-deselect failure mode above: if an extra goes
      # missing, collection drops well below the floor and this fails loudly
      # instead of reporting a green run over a shrunken suite. The floor is
      # intentionally slack (2646 collected locally at the time of writing).
      - name: Check collection floor
        run: |
          out=$(pytest --collect-only -q 2>/dev/null || true)
          count=$(echo "$out" | grep -oE '[0-9]+ tests? collected' | tail -1 | grep -oE '^[0-9]+' || true)
          echo "collected: $count"
          if [ -z "$count" ] || [ "$count" -lt 2500 ]; then
            echo "::error::Only ${count:-0} tests collected (expected >= 2500)."
            echo "::error::An optional dependency is probably missing."
            exit 1
          fi

      # -m "not slow" drops the stress suite, which stays a local gate
      # (scripts/ci-local.sh stress). Everything else runs, including the
      # spawn-based concurrent_mp tests.
      - name: Run tests
        run: pytest -m "not slow" --tb=short

  valkey:
    name: pytest (Valkey)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # The database number must match `popoto_test_db` in pyproject.toml;
      # tests/test_ci_workflow_redis_url.py fails if the two ever disagree.
      REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,embeddings,benchmark]"

      # Assert the service really is Valkey. A misconfigured service block
      # would otherwise run the Redis suite twice under a Valkey label, which
      # is the exact false confidence this job exists to prevent.
      - name: Verify server is Valkey
        run: |
          python - <<'PY'
          import sys
          import redis

          r = redis.from_url("redis://localhost:6379")
          r.ping()
          info = r.info("server")
          name = str(info.get("server_name", "redis")).lower()
          print("server_name:", name)
          print("version:", info.get("redis_version"))
          # Valkey reports its Redis-compatibility version in redis_version
          # (7.2.4 on valkey:8-alpine). Read both key names: the real server
          # version is not guaranteed to be published under server_version.
          print(
              "server_version:",
              info.get("server_version") or info.get("valkey_version"),
          )
          if name != "valkey":
              print("::error::Expected a Valkey server, got", name)
              sys.exit(1)
          PY

      - name: Check collection floor
        run: |
          out=$(pytest --collect-only -q 2>/dev/null || true)
          count=$(echo "$out" | grep -oE '[0-9]+ tests? collected' | tail -1 | grep -oE '^[0-9]+' || true)
          echo "collected: $count"
          if [ -z "$count" ] || [ "$count" -lt 2500 ]; then
            echo "::error::Only ${count:-0} tests collected (expected >= 2500)."
            echo "::error::An optional dependency is probably missing."
            exit 1
          fi

      - name: Run tests
        run: pytest -m "not slow" --tb=short

  # v2 Postgres backend (#759, docs/plans/sdlc-631-v2.md M0(c)). Runs only the
  # tests marked `conformance`, parametrised over both legs. Ported from the
  # frozen poc/backend-seam archive (#631 WS2) with the image bumped to
  # Postgres 18, the v2 minimum. It carries a Redis service as well as
  # Postgres on purpose: the pytest plugin binds Redis in pytest_configure and
  # its autouse fixture issues FLUSHDB before every test, and
  # tests/test_ci_workflow_redis_url.py requires every job in this file to pin
  # REDIS_URL to popoto_test_db.
  #
  # From M1b the Postgres leg binds PostgresBackend on the session schema, so
  # every model-level conformance test runs against the server; a test that
  # only holds on Redis is marked redis_only(reason=...) and skips there.
  # The `[PG-only]` tests under tests/postgres/ run here too (no Redis leg).
  postgres:
    name: pytest (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # The database number must match `popoto_test_db` in pyproject.toml;
      # tests/test_ci_workflow_redis_url.py fails if the two ever disagree.
      REDIS_URL: redis://localhost:6379/15
      # Names the database explicitly: the harness refuses a db-less URL
      # (PostgresIsolationRefusedError) the way the Redis side refuses DB 0.
      # The harness creates one popoto_test_<hex> schema per session inside
      # it and drops it at teardown; schema `public` is never touched.
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POPOTO_CONFORMANCE_BACKENDS: redis,postgres
      # tests/postgres/test_migrate_redis_to_postgres.py (#756) serves its
      # snapshot from a private redis-server binary, installed below. Here a
      # missing binary fails the module instead of skipping it.
      POPOTO_REQUIRE_REDIS_SERVER: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      # The `postgres` extra (#759 M1b) brings psycopg[binary,pool] and
      # pgvector. Without psycopg every Postgres leg skips, which would make
      # this job green by vacuity; the "Verify" step below fails if psycopg
      # cannot reach the service.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,embeddings,benchmark,postgres]"

      # The #756 migration tool starts its own throwaway redis-server on a
      # snapshot; the Redis service container is not a binary it can start.
      # policy-rc.d keeps apt from starting the packaged service, which would
      # fight the container for port 6379.
      - name: Install redis-server binary
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends redis-server
          sudo rm -f /usr/sbin/policy-rc.d
          redis-server --version

      - name: Verify servers reachable
        run: |
          python - <<'PY'
          import os
          import sys

          import psycopg
          import redis

          r = redis.from_url(os.environ["REDIS_URL"])
          r.ping()
          print("redis:", r.info("server").get("redis_version"))
          with psycopg.connect(os.environ["POSTGRES_URL"]) as conn:
              (version,) = conn.execute("SELECT version()").fetchone()
              (num,) = conn.execute("SHOW server_version_num").fetchone()
              # EmbeddingField needs pgvector (#759 M2b). The image ships
              # it; popoto never creates an extension, the operator does.
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
          print("postgres:", version)
          if int(num) < 180000:
              print("::error::Expected Postgres >= 18, got", num)
              sys.exit(1)
          PY

      - name: Run conformance tests
        run: pytest -m conformance --tb=short

      - name: Run Postgres-only tests
        run: pytest tests/postgres --tb=short

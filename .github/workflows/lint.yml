name: Lint

# Ruff gate for src/. The repo declared `ruff` in its dev extra but never
# configured or ran it, so 42 errors accumulated on main (#505) - undefined
# names in string annotations, unused imports, dead locals. This gate keeps
# them from coming back.
#
# Scope is src/ only: tests/, examples/ and benchmarks are not yet clean, and
# widening the gate is a separate change.

on:
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the ruff version. Ruff's default rule selection and the rules
      # themselves change between minor releases, so an unpinned `latest` turns
      # an unrelated PR red. Bump this deliberately, alongside the fixes the
      # new version wants.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.1"
          args: "check src/"

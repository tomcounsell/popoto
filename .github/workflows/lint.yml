name: Lint

# Ruff gate for src/. The repo declared `ruff` in its dev extra but never
# configured or ran it, so 42 errors accumulated on main (#505) - undefined
# names in string annotations, unused imports, dead locals. This gate keeps
# them from coming back.
#
# Ruff's scope is src/ only: tests/, examples/ and benchmarks are not yet clean,
# and widening the gate is a separate change.
#
# The black gate covers src/ and tests/, which were both already clean when it
# landed (#579). Until then nothing enforced formatting, so main drifted from its
# own black pin and every PR touching a drifted file carried unrelated churn.
#
# The mypy gate is a ratchet, not a clean-tree gate: src/ carries a four-figure
# error count that no single PR can clear, so `scripts/mypy_ratchet.py` fails only
# when the count rises ABOVE the baseline in `scripts/mypy_baseline.json` (#506).
# Two packages are pinned at exactly zero via that file's `clean` allowlist. The
# install below is load-bearing, not decoration: `ignore_missing_imports = True`
# in setup.cfg means an absent optional package resolves to Any and CHANGES the
# count, and the redis-py major alone is worth ~52 errors. Keep it byte-identical
# to `environment.install` in the baseline file.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "setup.cfg"
      - "scripts/mypy_ratchet.py"
      - "scripts/mypy_baseline.json"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "setup.cfg"
      - "scripts/mypy_ratchet.py"
      - "scripts/mypy_baseline.json"
      - ".github/workflows/lint.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pin the ruff version. Ruff's default rule selection and the rules
      # themselves change between minor releases, so an unpinned `latest` turns
      # an unrelated PR red. Bump this deliberately, alongside the fixes the
      # new version wants.
      - name: Install ruff
        run: python -m pip install "ruff==0.16.2"

      # Invoke the binary directly rather than via astral-sh/ruff-action. That
      # action appends its own `src` input (default: the repository root) after
      # the `args` string, so `args: "check src/"` ran
      # `ruff check src/ $GITHUB_WORKSPACE` and linted the whole tree,
      # including the deliberately ungated tests/. A plain `run:` step is the
      # only way to control the argument list exactly.
      - name: Lint
        run: |
          ruff --version
          ruff check src/

  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pin the black version for the same reason ruff is pinned: black's stable
      # style changes between releases, so an unpinned `latest` reformats the
      # tree from under an unrelated PR. The dev extra floors this at
      # black>=26.3.1; bump both together, alongside the reformat the new
      # version wants.
      - name: Install black
        run: python -m pip install "black==26.5.1"

      # Line length and target version come from [tool.black] in pyproject.toml.
      - name: Format check
        run: |
          black --version
          black --check --diff src/ tests/

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The extras are part of the pin. With `ignore_missing_imports = True`, a
      # package that is not installed resolves to Any and silently lowers the
      # count, so a thinner install would make the gate pass on a tree that is
      # not actually clean. mypy and redis-py are pinned on top of the floors for
      # the same reason ruff and black are pinned: the count moves with them.
      - name: Install
        run: |
          python -m pip install -e ".[dev,embeddings,mcp]"
          python -m pip install "mypy==2.3.1" "redis==8.1.0"

      # --strict-env makes an environment that does not match the baseline a
      # failure. Locally the same script refuses to compare and exits 0; in CI
      # the environment is pinned above, so a mismatch means the pin drifted and
      # the gate would otherwise be comparing incomparable numbers.
      - name: Mypy ratchet
        run: |
          python -m mypy --version
          python scripts/mypy_ratchet.py --strict-env

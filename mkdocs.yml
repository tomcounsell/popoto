site_name: Popoto Documentation
site_url: https://popoto.io/
site_description: >-
    Agent memory on Redis and Valkey, as primitives you program rather than a
    service you call. Records decay, confidence moves with evidence,
    associations form, and a context assembler packs the result into a token
    budget before each turn. Built on a full Redis/Valkey ORM.
repo_url: https://github.com/tomcounsell/popoto/
edit_uri: edit/main/docs
site_author: Tom Counsell

# Plan documents and the in-tree docs requirements file are not for the public
# site. Excluding them keeps the build deterministic and the published surface
# focused on user-facing content.
exclude_docs: |
    plans/
    requirements.txt
    scripts/
    hooks.py

# docs/hooks.py filters griffe warnings about missing type annotations so
# strict-mode builds don't fail on docstring polish issues. See hooks.py for
# rationale and to remove the filter if/when type-hint coverage improves.
hooks:
    - docs/hooks.py

nav:
    - Home: 'index.md'
    - Add Memory to Your Agent:
          - Quickstart: 'guides/agent-memory-quickstart.md'
          - SubconsciousMemory: 'guides/subconscious-memory-recipe.md'
          - Query-Blind Retrieval: 'guides/query-blind-retrieval.md'
          - LLM Memory Extraction: 'features/llm-memory-extraction.md'
    - Understand & Tune:
          - Agent Memory Overview: 'features/agent-memory.md'
          - Primitives:
                - DecayingSortedField: 'features/decaying-sorted-field.md'
                - CyclicDecayField: 'features/cyclic-decay-field.md'
                - ConfidenceField: 'features/confidence-field.md'
                - CoOccurrenceField: 'features/co-occurrence-field.md'
                - ExistenceFilter: 'features/existence-filter.md'
                - ObservationProtocol: 'features/observation-protocol.md'
                - PredictionLedger: 'features/prediction-ledger.md'
                - Composite Score Query: 'features/composite-score-query.md'
                - PolicyCache: 'features/policy-cache.md'
                - ContextAssembler: 'features/context-assembler.md'
                - Hybrid Retrieval (BM25 + RRF): 'features/hybrid-retrieval.md'
                - Metacognitive Layer: 'features/metacognitive-layer.md'
          - Recipes:
                - PolicyCache: 'guides/policy-cache-recipe.md'
                - TrajectoryMemory: 'guides/trajectory-memory-recipe.md'
                - RAG Chatbot: 'guides/rag-chatbot-recipe.md'
                - Memory Telemetry: 'features/memory-telemetry.md'
                - MemoryLifecycle and more: 'recipes.md'
          - Tuning:
                - Magic Numbers: 'guides/tuning-magic-numbers.md'
                - Parametric Sweep: 'features/parametric-sweep.md'
    - Benchmarks & Method:
          # Result pages are generated by docs/scripts/gen_benchmark_pages.py.
          # The `Results: benchmarks/results/` directory entry is resolved by the
          # literate-nav plugin against the generated benchmarks/results/SUMMARY.md,
          # which lists only the pages that were actually generated. That is what
          # lets a missing benchmark artifact degrade gracefully: the page is
          # absent from SUMMARY, so there is no dangling nav reference to fail
          # `mkdocs build --strict`.
          - Results: benchmarks/results/
          - Method and How-To: 'benchmarks.md'
    - Redis ORM:
          - Getting Started:
                - Configuration: 'configuration.md'
                - Models and Fields: 'fields.md'
                - Making Queries: 'query.md'
                - Async Operations: 'async.md'
          - Core Features:
                - Model Meta Options: 'meta.md'
                - TTL (Time-to-Live): 'ttl.md'
                - Indexed Fields: 'indexed_fields.md'
                - Relationship Field: 'relationship.md'
                - Multi-Tenancy: 'multi-tenancy.md'
                - PubSub: 'pubsub.md'
                - Content & Embeddings: 'features/content-and-embedding-fields.md'
          - Testing: 'testing.md'
    - API Reference: reference/index.md
    - Contributing: 'style-guide.md'

markdown_extensions:
    - admonition
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.superfences
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - toc:
          permalink: true

theme:
    name: material
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - content.code.copy
        - content.code.annotate
        - search.suggest
        - search.highlight
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: indigo
          accent: indigo
          toggle:
              icon: material/weather-sunny
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/weather-night
              name: Switch to light mode

plugins:
    - search
    - open-in-new-tab
    - gen-files:
          scripts:
              - docs/scripts/gen_api_pages.py
              - docs/scripts/gen_benchmark_pages.py
              - docs/scripts/gen_llms_full.py
    - literate-nav:
          nav_file: SUMMARY.md
    - mkdocstrings:
          handlers:
              python:
                  paths: [src]
                  options:
                      docstring_style: google
                      show_source: true
                      show_root_heading: true
                      members_order: source
                      filters: ["!^_"]

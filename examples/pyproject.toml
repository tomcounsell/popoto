[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "popoto-kitchen"
version = "0.1.0"
description = "Interactive TUI demo showcasing the Popoto Redis ORM"
requires-python = ">=3.8"
dependencies = [
    "popoto",
    "textual>=0.47.0",
]

[tool.uv.sources]
popoto = { path = "..", editable = true }

[project.scripts]
popoto-kitchen = "popoto_kitchen.__main__:main"

[build-system]
# setuptools>=83: first release with the MANIFEST.in exclusion-bypass fix
# (sdist Unicode NFC/NFD normalization collision on macOS APFS/HFS+, #678).
# This is a BUILD-environment constraint, not a runtime dependency, so
# CLAUDE.md's "never raise a floor" doctrine for [project.dependencies] does
# not apply here. Be precise about why (#694): the floor does NOT reach a
# wheel install, and it DOES constrain an sdist build -- including a
# consumer's, whenever their environment has no usable wheel or they pass
# --no-binary. That cost is priced and accepted rather than denied: setuptools
# 83.0.0 itself declares requires_python >= 3.10 and popoto already requires
# >=3.10, so no consumer who can install popoto at all is excluded by it.
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "popoto"
version = "1.10.0"
description = "Agent memory for LLM apps on Redis, Valkey or PostgreSQL: decay, confidence, associations, and context assembly, built on a full Python ORM"
readme = "README.md"
authors = [{ name = "Tom Counsell", email = "other@tomcounsell.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

keywords = [
    "agent-memory",
    "agent memory",
    "ai-agents",
    "llm",
    "llm-memory",
    "long-term-memory",
    "memory",
    "context",
    "context-engineering",
    "retrieval",
    "rag",
    "bm25",
    "embeddings",
    "vector-search",
    "semantic-search",
    "redis",
    "valkey",
    "postgres",
    "postgresql",
    "pgvector",
    "ORM",
    "database",
]
requires-python = ">=3.10"
dependencies = [
    "redis>=4.4.4",
    "msgpack>=1.0.4",
]

[project.optional-dependencies]
dataframe = [
    "pandas>=1.4.3",
    "numpy>=1.23.1",
    "msgpack-numpy>=0.4.8",
]
ulid = ["ulid-py>=1.1.0"]
ksuid = ["cyksuid>=1.0.0"]
embeddings = [
    "numpy>=1.23.1",
]
voyage = [
    "voyageai>=0.3.0",
    "numpy>=1.23.1",
]
openai = [
    "openai>=1.0.0",
    "numpy>=1.23.1",
]
# 0.77.0 is the measured minimum whose messages.create accepts
# output_config, which extraction/{claude,resolution,verdict}.py all pass.
# Below it the call raises TypeError. See #670 and
# docs/plans/anthropic_floor_and_silent_extraction_failure.md.
anthropic = [
    "anthropic>=0.77.0",
]
monitoring = [
    "sentry-sdk>=2.0.0",
]
# Agent-harness integration. Only the MCP server needs this; the hook path
# (popoto-memory hook) works on a bare `pip install popoto`, which is what
# keeps the core install at three packages with no API keys.
mcp = [
    "mcp>=1.2",
]
# The v2 Postgres backend (#759). Imported only when a model is bound to
# Postgres (Meta.backend = "postgres" or POPOTO_BACKEND=postgres): `import
# popoto` never imports psycopg. One install covers every field the backend
# stores, so each package below is one a Postgres-bound memory model needs:
#   psycopg[binary,pool] -- the driver. 3.2 is the first release with the
#     server-side pipeline/prepare controls the pool relies on, and 3.2.0 is
#     uninstallable with [binary] (it pins psycopg-binary==3.2.0.dev1, which
#     was never published), so the measured floor is 3.2.1.
#   psycopg-pool -- named on its own because the [pool] extra does not floor
#     it: psycopg 3.2.1 resolves with psycopg-pool 3.1.0, which has no
#     ConnectionPool.check_connection (the pool passes it as check=), so the
#     first connection fails. 3.2.0 is the first release that has it.
#     Measured for the 1.10.0 release.
#   pgvector -- EmbeddingField's vector type adapter.
#   numpy -- EmbeddingField imports it at module load; without it a clean
#     `pip install popoto[postgres]` raised ImportError on the first
#     EmbeddingField. 1.23.1 is the floor the embeddings extra already uses,
#     verified working with pgvector on Postgres.
#   greenlet -- runs the sync backend's code for the async_* methods with its
#     I/O on psycopg.AsyncConnection (popoto/backends/postgres/aio.py); without
#     it those methods fall back to a worker thread. 3.1.0 is the first
#     greenlet release with CPython 3.13 wheels (3.0.x ships cp37-cp312 only);
#     it has wheels for cp310-cp313 on macOS, manylinux, musllinux and
#     Windows, covering every Python popoto supports.
postgres = [
    "psycopg[binary,pool]>=3.2.1",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "numpy>=1.23.1",
    "greenlet>=3.1",
]
benchmark = [
    "huggingface_hub>=0.23",
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=7.1.2",
    "pytest-asyncio>=0.21.0",
    # Floored at the version lint.yml pins. The mypy ratchet (#506) compares a
    # count that moves with the checker version, and 0.971 predates the output
    # format scripts/mypy_ratchet.py parses. Dev-extra only, so this floor does
    # not reach library consumers.
    "mypy>=2.3.1",
    "black>=26.3.1",
    "ruff>=0.1.0",
    "tiktoken>=0.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "griffe>=0.45",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-open-in-new-tab>=1.0",
]

[project.urls]
Homepage = "https://popoto.io/"
Documentation = "https://popoto.io/"
Source = "https://github.com/tomcounsell/popoto"
Bug_Tracker = "https://github.com/tomcounsell/popoto/issues"

[project.scripts]
popoto-memory = "popoto.integrations.cli:main"
popoto-transfer = "popoto.transfer.cli:main"
popoto-migrate-redis-to-postgres = "popoto.migrate_redis_to_postgres:console_main"

[project.entry-points.pytest11]
popoto = "popoto.pytest_plugin"

[tool.pytest.ini_options]
markers = [
    "slow: stress and performance tests (deselect with '-m \"not slow\"')",
    "benchmark: performance benchmarking tests",
    "concurrent_mp: spawn-based multiprocess concurrency tests (skip with '-m \"not concurrent_mp\"')",
    "contract: production contracts that stay red until their fix lands (deselect with '-m \"not contract\"')",
]
addopts = "-v"
popoto_test_db = "15"

# The library suite lives in tests/. examples/ is a separate uv project with its
# own pyproject, its own dependencies (textual), and its own Redis database, run
# by .github/workflows/examples.yml — a bare `pytest` from the repo root would
# otherwise collect examples/tests/ and fail on ModuleNotFoundError: textual
# (#611). testpaths applies only when no path argument is given, so
# `pytest examples/tests/` still works if you ask for it explicitly.
testpaths = ["tests"]
norecursedirs = ["examples", ".worktrees", "*.egg", ".*", "build", "dist", "venv"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 79

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = ''

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# black owns formatting, so the pycodestyle rules it already enforces are left
# out: E1 (indentation), E2 (whitespace), E3 (blank lines) and E501 (line
# length, which black cannot fix inside strings/comments). What remains is the
# correctness-oriented default set.
#   E4 - import placement (E402)
#   E7 - statement-level bugs (E711/E712/E721 ...)
#   E9 - syntax/IO errors
#   F  - pyflakes (undefined names, unused imports/variables)
select = ["E4", "E7", "E9", "F"]
# "I" (isort) is intentionally not selected: import order is owned by isort
# (line_length 79 in [tool.isort]) and enabling it here would rewrite import
# blocks across the package.
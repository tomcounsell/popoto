[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "popoto"
version = "1.8.2"
description = "Agent memory for LLM apps on Redis or Valkey: decay, confidence, associations, and context assembly, built on a full Python ORM"
readme = "README.md"
authors = [{ name = "Tom Counsell", email = "other@tomcounsell.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

keywords = [
    "agent-memory",
    "agent memory",
    "ai-agents",
    "llm",
    "llm-memory",
    "long-term-memory",
    "memory",
    "context",
    "context-engineering",
    "retrieval",
    "rag",
    "bm25",
    "embeddings",
    "vector-search",
    "semantic-search",
    "redis",
    "valkey",
    "ORM",
    "database",
]
requires-python = ">=3.10"
dependencies = [
    "redis>=4.4.4",
    "msgpack>=1.0.4",
]

[project.optional-dependencies]
dataframe = [
    "pandas>=1.4.3",
    "numpy>=1.23.1",
    "msgpack-numpy>=0.4.8",
]
ulid = ["ulid-py>=1.1.0"]
ksuid = ["cyksuid>=1.0.0"]
embeddings = [
    "numpy>=1.23.1",
]
voyage = [
    "voyageai>=0.3.0",
    "numpy>=1.23.1",
]
openai = [
    "openai>=1.0.0",
    "numpy>=1.23.1",
]
anthropic = [
    "anthropic>=0.40.0",
]
monitoring = [
    "sentry-sdk>=2.0.0",
]
benchmark = [
    "huggingface_hub>=0.23",
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=7.1.2",
    "pytest-asyncio>=0.21.0",
    "mypy>=0.971",
    "black>=26.3.1",
    "ruff>=0.1.0",
    "tiktoken>=0.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "griffe>=0.45",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-open-in-new-tab>=1.0",
]

[project.urls]
Homepage = "https://popoto.io/"
Documentation = "https://popoto.io/"
Source = "https://github.com/tomcounsell/popoto"
Bug_Tracker = "https://github.com/tomcounsell/popoto/issues"

[project.entry-points.pytest11]
popoto = "popoto.pytest_plugin"

[tool.pytest.ini_options]
markers = [
    "slow: stress and performance tests (deselect with '-m \"not slow\"')",
    "benchmark: performance benchmarking tests",
    "concurrent_mp: spawn-based multiprocess concurrency tests (skip with '-m \"not concurrent_mp\"')",
]
addopts = "-v"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 79

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = ''
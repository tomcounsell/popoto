[metadata]
name = popoto
author = Tom Counsell
author_email = other@tomcounsell.com
description = A Python Redis ORM
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/tomcounsell/popoto
project_urls =
    Bug Tracker = https://github.com/tomcounsell/popoto/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[flake8]
extend-ignore = E203

[mypy]
# Resolve popoto's own absolute self-imports against this checkout instead of
# letting ignore_missing_imports degrade them to Any (#663). Without these two,
# `from popoto import Model` inside src/ is unchecked and a typo on the package
# namespace is invisible to the gate. They are a pair: mypy_path alone fails with
# "Source file found twice under different module names", because mypy cannot
# tell whether src/popoto/ is the package `popoto` or the subpackage `popoto` of
# `src`. explicit_package_bases resolves that by treating mypy_path entries as
# package roots. This only pays off because #659 hid the PEP 562 module
# __getattr__ behind a TYPE_CHECKING guard; an unguarded hook would answer for
# every unknown attribute and re-suppress exactly what this resolves.
mypy_path = src
explicit_package_bases = True
follow_imports = silent
strict_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_any_generics = True
check_untyped_defs = True
no_implicit_reexport = True
disallow_untyped_defs = True
ignore_missing_imports = True

[mypy-tests.*]
ignore_errors = True
